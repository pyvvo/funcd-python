# The Lake `lake`: a DuckDB engine that keeps its tables as Parquet files under the prefix gold of the Bucket
# lakehouse, which the Lake declares and owns, and its catalog in funcd's catalog store, outside the Bucket.
#
# spec.location must be one of spec.bindings.blob, a prefix that the Lake owns. The bound Secret holds
# QUACK_TOKEN, the token that the engine accepts: the Lake gateway passes it on in place of the token of each
# caller that it allows. The bound ConfigMap sets the engine's DuckDB settings.
# region lake
apiVersion: funcd.io/v1alpha1
kind: Lake
metadata:
  name: lake
  namespace: default
  resourceGroup: rg1
spec:
  buckets:
    - name: lakehouse
      prefixes:
        - name: gold
      quota:
        maxObjectBytes: 1073741824
  configMaps:
    - ref: lake-engine-config
  secrets:
    - name: lake-quack-token
      keys:
        - QUACK_TOKEN
  bindings:
    blob:
      - alias: gold
        bucket: lakehouse
        prefix: gold
    secret:
      - lake-quack-token         # its key QUACK_TOKEN is the token that the engine accepts
    config:
      - lake-engine-config       # DUCKDB_MEMORY_LIMIT and DUCKDB_THREADS set the engine's memory limit and threads
  location:
    bucket: lakehouse
    prefix: gold               # the Parquet files under gold/; the catalog in funcd's catalog store, outside the Bucket
  resources:
    cpu: "2"
    memory: "4Gi"
  ingress:                     # exposes the Lake gateway at the edge, for callers outside funcd
    enabled: true              # off unless true
    path: /lake/lake           # the gateway checks each caller for lake::query, as it checks a Function
# endregion lake
