[project]
name = "funcd-example-releve-lakehouse"
version = "0.1.0"
description = "A medallion lakehouse pipeline on funcd: bank-statement PDFs → bronze/silver Parquet → gold DuckLake, with a reactive trigger, a cross-check gate + a PII gate, and confidential-egress lockdown."
authors = [{ name = "The funcd Authors" }]
requires-python = ">=3.12"
# funcd-shim is the typed authoring contract (CloudEvent/FunctionContext). The runtime deps below are the
# native closure `uv run funcd-bundle` vendors, at the versions uv.lock pins, into each step's ADR-0089 bundle
# (funcd ADR-0144); at deploy they travel IN the artifact, on the stock python314 runtime.
dependencies = [
    "funcd-shim",
    "pdfplumber>=0.11",   # extract + verify: geometric / text PDF extraction
    "pyarrow>=17",        # bronze/silver Parquet I/O
    "duckdb>=1.5.4",      # build-silver conform/dedup; to-gold Quack client
]

[dependency-groups]
dev = ["funcd-bundle", "mypy>=1.13", "pytest>=8.3", "pyyaml>=6.0.2", "ruff>=0.8", "types-pyyaml>=6.0.12"]
# reportlab and faker (MIT) generate the synthetic statements (landing/generate_synthetic.py).
build = [
    "reportlab>=5.0.0",
    "faker>=30",
]

[tool.uv.sources]
funcd-shim = { path = "../../shim", editable = true }
funcd-bundle = { path = "../../bundle", editable = true }

# `uv run funcd-bundle` builds inside the pinned python:3.14-slim-bookworm, then installs the quack and httpfs
# extensions to-gold and query-transactions load offline (checked by SHA-256).
[tool.funcd-bundle]
hermetic = true
post-install = ["python", "scripts/install_extensions.py"]

# Each function is pushed as its own bundle (dist/<function>/) — there is no importable wheel; the code is
# authored + typechecked in place under functions/.
[tool.mypy]
strict = true
python_version = "3.12"
files = ["functions", "tests"]
mypy_path = "functions"
explicit_package_bases = true    # functions/<fn>/handler.py are distinct namespace modules (extract.handler, …)
namespace_packages = true
exclude = ['dist/']

[[tool.mypy.overrides]]
module = "pyarrow.*"  # ships no type stubs
ignore_missing_imports = true

# Each step imports the funcd_types.py generated beside its handler, the bundle root at runtime. One mypy run
# cannot put every step directory at the top of its search path, so that import stays unresolved here.
[[tool.mypy.overrides]]
module = "funcd_types"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
# the vendored wheel closure, and the types `funcdctl types` generates
extend-exclude = ["dist", "functions/*/funcd_types.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
