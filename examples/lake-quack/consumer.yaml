# lake-reader: a Function that runs the SQL of each call on the Lake `lake` and returns the rows.
# Call it with POST /function/lake-reader and {"sql": "SELECT ..."}.
#
# It runs on the python314 runtime. Its bundle carries the duckdb package and the quack and httpfs
# extensions: build it with `uv run funcd-bundle` into dist/lake-reader/, then
#   funcdctl push dist/lake-reader <ref>
#
# The binding under spec.bindings.lake allows the Function to query the Lake, and gives each worker
# FUNCD_LAKE_LAKE_URL, the address of the Lake gateway, and FUNCD_LAKE_LAKE_TOKEN, the Function's own token.
# The Function waits in Pending until the Lake is Ready.
# region manifest
apiVersion: funcd.io/v1alpha1
kind: Function
metadata:
  name: lake-reader
  namespace: default
  resourceGroup: rg1
spec:
  runtime: python314            # the duckdb package travels in the bundle
  handler: handle
  image: oci-layout:///mnt/funcd-deps/registry:lake-reader   # funcdctl push dist/lake-reader …
  replicas: 1
  scaling:
    minReplicas: 1
  # Binds the Lake under the alias lake: each worker gets FUNCD_LAKE_LAKE_URL and FUNCD_LAKE_LAKE_TOKEN.
  lakes:
    - ref: lake
  bindings:
    lake:
      - alias: lake
        lake: lake
# endregion manifest
