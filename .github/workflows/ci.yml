name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

# pull-requests:read lets paths-filter list a PR's changed files. actions:write lets
# cache-nix-action list, save and purge its store caches.
permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  # A change that touches no code (only Markdown or LICENSE) skips the ci job. A skipped
  # required job still reports success, so a docs-only PR is not blocked.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      nonrelease: ${{ steps.filter.outputs.nonrelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!LICENSE'
            # Anything a release PR does not touch.
            nonrelease:
              - '**'
              - '!CHANGELOG.md'
              - '!version.txt'
              - '!.release-please-manifest.json'

  # release-please's PR only bumps the version and the changelog of an already checked main,
  # so it skips the ci job on the PR and in the merge queue. A release branch that touches
  # any other file still runs it.
  ci:
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      !(needs.changes.outputs.nonrelease == 'false' &&
      (github.head_ref == 'release-please--branches--main' ||
      startsWith(github.event.merge_group.head_commit.message, 'chore(main): release')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: 0
          purge-primary-key: never

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      # funcd-bundle's tests import-check a bundle for the other architecture under emulation.
      - uses: docker/setup-qemu-action@v4

      - name: Run CI (ruff, mypy, pytest, drift check, Go)
        run: nix develop --command just ci
