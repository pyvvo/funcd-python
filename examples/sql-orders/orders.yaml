# Function orders, the owner of orders-db: spec.bindings.sql binds it as the alias app.
apiVersion: funcd.io/v1alpha1
kind: Function
metadata:
  name: orders
  namespace: default
  resourceGroup: rg1
spec:
  runtime: python314
  handler: handle
  image: oci-layout:///mnt/funcd-deps/registry:orders
  sql:
    - ref: orders-db
  bindings:
    sql:
      - alias: app
        database: orders-db
