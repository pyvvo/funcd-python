runtime: python314
# extract processes EVERY PDF in landing/ (bronze is 1:1 with a source file; cross-statement
# aggregation is build-silver's job), so it ignores its input. A run starts with none (`workflow run`
# with no --input sends null) or from the releve-ingest Sensor, whose run input is always an object
# (ADR-0109), so the input is the explicit Json form (ADR-0058): any value. Output is a run summary.
input: {}
output:
  type: object
  additionalProperties: false
  properties:
    statements:
      type: integer
    debit:
      type: string
    credit:
      type: string
  required:
    - statements
    - debit
    - credit
