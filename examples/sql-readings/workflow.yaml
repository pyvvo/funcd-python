# Workflow readings: ingest stores a batch of a sensor's values in readings-db, then summarize reads them back with a
# CTE and window functions. The Workflow owns the database (funcd ADR-0250): its owner, step ingest, is materialized
# as Function readings-ingest, its writer; each step binds it (funcd ADR-0233).
apiVersion: funcd.io/v1alpha1
kind: Workflow
metadata:
  name: readings
  namespace: default
  resourceGroup: rg1
spec:
  sql:
    - name: readings-db
      owner: ingest
  steps:
    - name: ingest
      function:
        image: oci-layout:///mnt/funcd-deps/registry:ingest
        bindings:
          sql:
            - alias: app
              database: readings-db
    - name: summarize
      function:
        image: oci-layout:///mnt/funcd-deps/registry:summarize
        bindings:
          sql:
            - alias: app
              database: readings-db
      dependsOn:
        - ingest
