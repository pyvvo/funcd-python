# The daemon config of the sql-orders example on containerd: file storage, so orders-db's engine keeps its data in a
# durable directory under /var/lib/funcd/data (funcd ADR-0231).
apiVersion: funcd.io/v1alpha1
kind: FuncdConfig
server:
  listenAddr: 127.0.0.1:8080
  dataPlaneAddr: 127.0.0.1:8081
storage:
  mode: file
  dataDir: /var/lib/funcd/data
auth:
  token: funcd-dev-token
  namespaces:
    - default
runtime:
  mode: containerd
log:
  format: text
  level: info
