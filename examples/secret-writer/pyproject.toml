[project]
name = "funcd-example-secret-writer"
version = "0.1.0"
description = "A funcd example of Secret writes: py-token-owner, the owner of the Secret py-demo-token, writes and deletes its key TOKEN through context.secret; py-token-user binds the same Secret and writes it only once a RolesAssignment gives it the role Secret Data Writer."
authors = [{ name = "The funcd Authors" }]
requires-python = ">=3.12"
# funcd-shim is the typed authoring contract, for the typecheck and the tests: the runtime provides the shim.
dependencies = ["funcd-shim"]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[tool.uv.sources]
funcd-shim = { path = "../../shim", editable = true }

# Each function runs from its entry, read here by funcdctl dev and funcd-bundle. Neither needs a third-party
# package, so each one is pushed as a single file.
[tool.funcd-bundle.functions]
py-token-owner = "src/py-token-owner/main.py"
py-token-user = "src/py-token-user/main.py"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
python_version = "3.12"
# Each src/<function>/main.py is checked on its own, from inside its directory (tests/test_typecheck.py).
files = ["tests"]
mypy_path = "tests"
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
