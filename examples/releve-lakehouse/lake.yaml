# lake — the F48 lake/query engine (ADR-0086), deployed as an add-on provider (ADR-0087), NOT a Function.
# It owns + writes the `gold` prefix (DuckLake Parquet; its catalog sits in funcd's catalog store) and binds
# `silver` READ so a mart can read the conformed table. `to-gold` drives `CREATE TABLE gold.mart AS SELECT …
# FROM silver…` over Quack; `lake-reader` serves interactive read SQL. Every Quack client presents the
# QUACK_TOKEN from the bound Secret (a token-less client is refused).
apiVersion: funcd.io/v1alpha1
kind: Lake
metadata:
  name: lake
  namespace: default
  resourceGroup: rg1
spec:
  buckets:
    - ref: releves
  configMaps:
    - ref: lake-engine-config
  secrets:
    - name: lake-quack-token
      keys:
        - QUACK_TOKEN
  bindings:
    blob:
      - alias: silver             # READ the conformed silver tables (to build marts)
        bucket: releves
        prefix: silver
      - alias: gold              # OWN + WRITE gold (the lake + Parquet marts live here)
        bucket: releves
        prefix: gold
    secret:
      - lake-quack-token         # Secret Data key QUACK_TOKEN → engine env
    config:
      - lake-engine-config       # ConfigMap Data keys (DUCKDB_*) → engine env
  location:
    bucket: releves
    prefix: gold               # Parquet under gold/; the catalog in funcd's catalog store (funcd ADR-0293)
  resources:
    cpu: "2"
    memory: "4Gi"
