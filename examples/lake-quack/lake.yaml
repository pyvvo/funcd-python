# The F48 lake/query service (ADR-0086), deployed as an add-on provider by the provider-runtime
# (ADR-0087) — NOT a Function. The reconciler derives the per-fn S3 keypair over the provider identity
# (default/lake), resolves spec.bindings.config (the DUCKDB_* ConfigMap) into the engine env, and the
# provider-runtime Create/Start's the curated `duckdb` engine (image entrypoint = the Python shim),
# probes GET /=200 readiness, and publishes status.
#
# spec.bindings.blob MUST include the lake's (bucket, prefix) — it is the bound, owned binding the engine
# writes its lake + Parquet through (the Validate rule). spec.bindings.secret carries the Quack token the
# engine serves with (every consumer presents the same — a Quack client always needs a token). Every binding
# names an entry of the root (funcd ADR-0251): the lake owns its lakehouse Bucket, and declares the
# ConfigMap and the Secret it reads.
apiVersion: funcd.io/v1alpha1
kind: Lake
metadata:
  name: lake
  namespace: default
  resourceGroup: rg1
spec:
  buckets:
    - name: lakehouse
      prefixes:
        - name: gold
      maxObjectBytes: 1073741824
  configMaps:
    - ref: lake-engine-config
  secrets:
    - name: lake-quack-token
      keys:
        - QUACK_TOKEN
  bindings:
    blob:
      - alias: gold
        bucket: lakehouse
        prefix: gold
    secret:
      - lake-quack-token         # Secret Data key QUACK_TOKEN → engine env (the Quack auth token)
    config:
      - lake-engine-config       # ConfigMap Data keys (DUCKDB_*) → engine env
  location:
    bucket: lakehouse
    prefix: gold               # SQLite catalog at gold/_ducklake/catalog.db; Parquet under gold/
  resources:
    cpu: "2"
    memory: "4Gi"
  ingress:                     # ADR-0138/0241: OPT-IN external edge exposure of the lake::query PEP proxy
    enabled: true              # a lake ingress is off unless enabled
    path: /lake/lake        # the gateway routes this edge path to the PROXY (never the engine); the
                               # proxy PEPs lake::query, so an external caller is authorized like internal
