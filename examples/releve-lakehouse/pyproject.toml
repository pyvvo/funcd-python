[project]
name = "funcd-example-releve-lakehouse"
version = "0.1.0"
description = "A medallion lakehouse pipeline on funcd: bank-statement PDFs → bronze/silver Parquet → gold DuckLake, with a reactive trigger, a cross-check gate + a PII gate, and confidential-egress lockdown."
authors = [{ name = "The funcd Authors" }]
requires-python = ">=3.12"
# funcd-shim is the typed authoring contract (CloudEvent/FunctionContext). The runtime deps below are the
# native closure `uv run funcd-bundle` vendors, at the versions uv.lock pins, into each step's ADR-0089 bundle
# (funcd ADR-0144); at deploy they travel IN the artifact, on the stock python314 runtime.
dependencies = [
    "funcd-shim",
    "pdfplumber>=0.11",   # extract + verify: geometric / text PDF extraction
    "pyarrow>=17",        # bronze/silver Parquet I/O
    "duckdb>=1.5.4",      # build-silver conform/dedup; to-gold Quack client
]

[dependency-groups]
dev = ["funcd-bundle", "mypy>=1.13", "pytest>=8.3", "pyyaml>=6.0.2", "ruff>=0.8", "types-pyyaml>=6.0.12"]
# reportlab and faker (MIT) generate the synthetic statements (landing/generate_synthetic.py).
build = [
    "reportlab>=5.0.0",
    "faker>=30",
]

[tool.uv.sources]
funcd-shim = { path = "../../shim", editable = true }
funcd-bundle = { path = "../../bundle", editable = true }

# `uv run funcd-bundle` builds inside the pinned python:3.14-slim-bookworm, then installs the quack and httpfs
# extensions to-gold and lake-reader load offline (checked by SHA-256).
[tool.funcd-bundle]
hermetic = true
post-install = ["python", "scripts/install_extensions.py"]

# Each function is pushed as its own bundle (dist/<function>/) from its entry here (funcd ADR-0247) — there is no
# importable wheel; the code is authored + typechecked in place under src/<function>/.
[tool.funcd-bundle.functions]
extract = "src/extract/main.py"
verify = "src/verify/main.py"
build-silver = "src/build-silver/main.py"
to-gold = "src/to-gold/main.py"
lake-reader = "src/lake-reader/main.py"

[tool.mypy]
strict = true
python_version = "3.12"
# Each src/<function>/ is checked on its own, from inside it (tests/test_typecheck.py): every function has a
# main.py and a funcd_types.py, and a function name such as build-silver is no package name.
files = ["tests"]
exclude = ['dist/']

[[tool.mypy.overrides]]
module = "pyarrow.*"  # ships no type stubs
ignore_missing_imports = true

# Each step imports the funcd_types.py generated beside its handler, the bundle root at runtime. Those generated
# types are not checked: the import stays Any, as it was when mypy could not resolve it.
[[tool.mypy.overrides]]
module = "funcd_types"
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
# the vendored wheel closure, and the types `funcdctl types` generates
extend-exclude = ["dist", "src/*/funcd_types.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
