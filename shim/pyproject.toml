[project]
name = "funcd-shim"
# Not bumped per release: a bump would make every uv.lock stale. The vX.Y.Z git tag is the version.
version = "0.1.0"
description = "The funcd Python runtime shim, the types handlers are written against, and the contract build"
authors = [{ name = "The funcd Authors" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastjsonschema>=2.21.2",
]

[project.optional-dependencies]
# the contract build (funcd_shim.build) reads FuncInput/FuncOutput through pydantic
build = ["pydantic>=2.13.4"]

[project.urls]
Homepage = "https://github.com/pyvvo/funcd-python"
Repository = "https://github.com/pyvvo/funcd-python"

[project.scripts]
funcd-shim = "funcd_shim.shim:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funcd_shim"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pydantic>=2.13.4",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "fastjsonschema.*"  # ships no type stubs; used only as a build-time validator generator
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S310"]  # asserts are the point of tests; S310 = loopback urllib in tests
