# The client config of step ingest (funcd ADR-0122); `funcdctl dev workflow.yaml` runs the Workflow from source with
# readings-db (funcd ADR-0237).
runtime: python314
handler: handle
main: src/ingest.py
dev:
  python: .venv/bin/python
bindings:
  sql:
    - alias: app
      database: readings-db
contract:
  input:
    type: object
    additionalProperties: false
    properties:
      sensor:
        type: string
      values:
        type: array
        items:
          type: number
    required:
      - sensor
      - values
  output:
    type: object
    additionalProperties: false
    properties:
      sensor:
        type: string
      stored:
        type: integer
    required:
      - sensor
      - stored
