# lake-quack-token: QUACK_TOKEN, the token that the Lake's engine accepts. The Lake gateway checks each caller with
# the caller's own token, then passes this one on to the engine.
apiVersion: funcd.io/v1alpha1
kind: Secret
metadata:
  name: lake-quack-token
  namespace: default
  resourceGroup: rg1
spec:
  type: Opaque   # the only type; funcd does not read it
  data:
    QUACK_TOKEN: ZnVuY2QtY2F0YWxvZy10b2tlbg==   # base64 of funcd-catalog-token
