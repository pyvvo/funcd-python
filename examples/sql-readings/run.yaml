# A run of Workflow readings with one batch of values.
apiVersion: funcd.io/v1alpha1
kind: WorkflowRun
metadata:
  name: readings-run-1
  namespace: default
  resourceGroup: rg1
spec:
  workflow: readings
  input:
    sensor: greenhouse
    values:
      - 21.5
      - 22.0
      - 23.5
      - 22.5
