# lake-engine-config: the engine settings that the Lake binds. The engine applies DUCKDB_MEMORY_LIMIT, DUCKDB_THREADS
# and DUCKDB_MAX_TEMP_DIRECTORY_SIZE as DuckDB settings before any other; any other DUCKDB_ key stops the engine at
# start, and a key that starts with FUNCD_ never reaches it.
apiVersion: funcd.io/v1alpha1
kind: ConfigMap
metadata:
  name: lake-engine-config
  namespace: default
  resourceGroup: rg1
spec:
  data:
    DUCKDB_MEMORY_LIMIT: "3GB"
    DUCKDB_THREADS: "2"
