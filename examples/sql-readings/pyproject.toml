[project]
name = "funcd-example-sql-readings"
version = "0.1.0"
description = "A funcd SQL example (FEAT-0011): a Workflow whose steps share a SQL database, with SQLAlchemy Core statements, a CTE and window functions."
authors = [{ name = "The funcd Authors" }]
requires-python = ">=3.12"
# SQLAlchemy Core builds the statements, compiled with the SQLite dialect and sent through context.sql; funcd-bundle
# vendors it for the runtime.
dependencies = ["readings-core", "funcd-shim", "sqlalchemy==2.0.54"]

[dependency-groups]
dev = ["funcd-bundle", "mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
readings-core = { workspace = true }
funcd-shim = { path = "../../shim", editable = true }
funcd-bundle = { path = "../../bundle", editable = true }

# Each function is bundled from its entry (funcd ADR-0247); the code they share is the readings-core workspace
# package, which funcd-bundle vendors as a wheel (funcd ADR-0144).
[tool.funcd-bundle.functions]
ingest = "src/ingest/main.py"
summarize = "src/summarize/main.py"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
python_version = "3.12"
# Each src/<function>/main.py is checked on its own, from inside its directory (tests/test_typecheck.py).
files = ["packages", "tests"]
mypy_path = "tests"
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
