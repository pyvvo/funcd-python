# Function orders-migrate: its spec.bindings.sql binding is its access to orders-db as alias app (funcd ADR-0233).
apiVersion: funcd.io/v1alpha1
kind: Function
metadata:
  name: orders-migrate
  namespace: default
  resourceGroup: rg1
spec:
  runtime: python314
  handler: handle
  image: oci-layout:///mnt/funcd-deps/registry:orders-migrate
  sql:
    - ref: orders-db
  bindings:
    sql:
      - alias: app
        database: orders-db
