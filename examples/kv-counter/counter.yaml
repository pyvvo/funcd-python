# kv-counter (Python) — increments a per-name counter in the KV binding "py-counters" via context.kv
# (ADR-0069). The Python sibling of funcd-typescript's examples/kv-counter; runs on the curated python314 runtime image.
# pycounter owns its KVStore: the root `kv` entry creates py-counters, whose table-counters owner defaults to
# pycounter (funcd ADR-0248), so it may write it. The spec.bindings.kv entry (ADR-0073) maps the alias "pycounters"
# to that table; the binding IS the read capability (default-deny).
apiVersion: funcd.io/v1alpha1
kind: Function
metadata:
  name: pycounter
  namespace: default
  resourceGroup: rg1
spec:
  runtime: python314
  handler: handle
  image: oci-layout:///mnt/funcd-deps/registry:pycounter   # funcdctl push src/counter.py, its manifest beside it
  replicas: 1
  scaling:
    minReplicas: 1
  kv:
    - name: py-counters         # the KVStore (domain) this function owns
      tables:
        - name: table-counters  # the sub-domain pycounter owns (single writer)
  bindings:
    kv:
      - alias: pycounters       # the in-code handle: context.kv.*('pycounters', …)
        store: py-counters      # the KVStore (domain)
        table: table-counters   # the sub-domain pycounter owns (single writer)
