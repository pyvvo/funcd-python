[project]
name = "funcd-example-sql-readings"
version = "0.1.0"
description = "A funcd SQL example (FEAT-0011): a Workflow whose steps share a SQL database, with SQLAlchemy Core statements, a CTE and window functions."
authors = [{ name = "The funcd Authors" }]
requires-python = ">=3.12"
# SQLAlchemy Core builds the statements, compiled with the SQLite dialect and sent through context.sql; funcd-bundle
# vendors it for the runtime.
dependencies = ["funcd-shim", "sqlalchemy==2.0.54"]

[dependency-groups]
dev = ["funcd-bundle", "mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[tool.uv.sources]
funcd-shim = { path = "../../shim", editable = true }
funcd-bundle = { path = "../../bundle", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src:tests"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
