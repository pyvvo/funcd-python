runtime: python314
input:
  type: object
  additionalProperties: false
  properties:
    op:
      type: string
      enum:
        - put
        - delete
    value:
      type: string
  required:
    - op
output:
  type: object
  additionalProperties: false
  properties:
    token:
      type:
        - string
        - "null"
  required:
    - token
