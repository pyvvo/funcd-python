# The client config of step summarize (funcd ADR-0122): its input is ingest's output.
runtime: python314
handler: handle
main: src/summarize.py
dev:
  python: .venv/bin/python
bindings:
  sql:
    - alias: app
      database: readings-db
contract:
  input:
    type: object
    additionalProperties: false
    properties:
      sensor:
        type: string
      stored:
        type: integer
    required:
      - sensor
      - stored
  output:
    type: object
    additionalProperties: false
    properties:
      sensor:
        type: string
      count:
        type: integer
      mean:
        type: number
      low:
        type: number
      high:
        type: number
      latest:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            seq:
              type: integer
            value:
              type: number
            moving_avg:
              type: number
            rank:
              type: integer
          required:
            - seq
            - value
            - moving_avg
            - rank
    required:
      - sensor
      - count
      - mean
      - low
      - high
      - latest
