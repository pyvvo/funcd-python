name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A PR opened with the default GITHUB_TOKEN triggers no workflows, so its checks never
      # run. RELEASE_PLEASE_TOKEN (a PAT or app token) fixes that; until it exists an org admin
      # merges the release PR through the ruleset bypass.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
