[project]
name = "funcd-example-releve-lakehouse"
version = "0.1.0"
description = "A medallion lakehouse pipeline on funcd: bank-statement PDFs → bronze/silver Parquet → gold DuckLake, with a reactive trigger, a cross-check gate + a PII gate, and confidential-egress lockdown."
authors = [{ name = "The funcd Authors" }]
requires-python = ">=3.12"
# funcd-shim is the typed authoring contract (CloudEvent/FunctionContext). The runtime deps below are the
# native closure each step vendors into its ADR-0089 bundle (functions/build.py); they are declared here for
# LOCAL typecheck + tests only — at deploy they travel IN the artifact, on the stock python314 runtime.
dependencies = [
    "funcd-shim",
    "pdfplumber>=0.11",   # extract + verify: geometric / text PDF extraction
    "pyarrow>=17",        # bronze/silver Parquet I/O
    "duckdb>=1.5.4",      # build-silver conform/dedup; to-gold Quack client
]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "pyyaml>=6.0.2", "ruff>=0.8", "types-pyyaml>=6.0.12"]
# functions/build.py bakes the ADR-0058 validators at push time; it needs pydantic (build-time only).
# faker (MIT) generates the synthetic statement fake data (landing/generate_synthetic.py) — build-time only.
build = [
    "pydantic>=2.13.4",
    "reportlab>=5.0.0",
    "faker>=30",
]

[tool.uv.sources]
funcd-shim = { path = "../../shim", editable = true }

# Each function is pushed as its own bundle (functions/build.py) — there is no importable wheel; the code is
# authored + typechecked in place under functions/.
[tool.mypy]
strict = true
python_version = "3.12"
files = ["functions", "tests"]
mypy_path = "functions"
explicit_package_bases = true    # functions/<fn>/handler.py are distinct namespace modules (extract.handler, …)
namespace_packages = true
exclude = ['functions/.*/bundle/']   # vendored wheels (build.py output) are not ours to typecheck

[tool.pytest.ini_options]
testpaths = ["tests"]            # don't recurse into functions/*/bundle (vendored wheels from build.py)

[tool.ruff]
line-length = 110
target-version = "py312"
# the vendored wheel closure, and the types `funcdctl types` generates
extend-exclude = ["functions/*/bundle", "functions/*/funcd_types.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
