# extract — dev manifest (ADR-0122/0124/0125). Runs functions/extract/handler.py IN PLACE via `main`
# (its own dir is the bundle root, so the generated funcd_types.py beside it resolves and FUNCD_BUNDLE_DIR
# points there). Bindings mirror the extract Function spec in resources/functions.yaml: config
# releve-project-config, blob landing (read the dropped PDF) + bronze (write the Parquet). Contract is
# the handler's FuncInput/FuncOutput TypedDicts.
runtime: python314
handler: handle
main: functions/extract/handler.py
bindings:
  config:
    - releve-project-config
  blob:
    - alias: landing
      bucket: releves
      prefix: landing
    - alias: bronze
      bucket: releves
      prefix: bronze
contract:
  # extract processes EVERY PDF in landing/ (bronze is 1:1 with a source file; cross-statement
  # aggregation is build-silver's job), so it ignores its input. A run starts with none (`workflow run`
  # with no --input sends null) or from the releve-ingest Sensor, whose run input is always an object
  # (ADR-0109), so the input is the explicit Json form (ADR-0058): any value. Output is a run summary.
  input: {}
  output:
    type: object
    additionalProperties: false
    properties:
      statements:
        type: integer
      debit:
        type: string
      credit:
        type: string
    required:
      - statements
      - debit
      - credit
dev:
  # the project virtualenv (carries pdfplumber/pyarrow/duckdb); funcdctl dev launches handlers with it
  python: .venv/bin/python
  backends:
    blob: "file://.funcd-dev/blob"
  config:
    releve-project-config:
      STOP_KEYWORDS: "TOTALDESOPERATIONS,TOTALDES,Soldecréditeur,Soldedébiteur,RELEVEDECOMPTE,Titulaire,PERIODE,NATUREDESOPERATIONS,Soldeau,Crédit,Débit,Bank,<ACCOUNT_NUMBER>"
      BANK: "bank"
      CLASSIFICATION: "confidential"
